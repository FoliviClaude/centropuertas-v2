[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (ligne trop longue) desactive : avec black, ruff ne doit pas
# dupliquer la mise en forme du code -- et chaines de traduction,
# requetes SQL et docstrings ne peuvent de toute facon pas etre
# raccourcis par un formateur. Pratique standard black+ruff.
ignore = ["E501"]
