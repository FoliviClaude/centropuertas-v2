[project]
name = "centropuertas-v2"
version = "1.0.0"
description = "Application de partes de trabajo Centropuertas (Streamlit + Turso)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "streamlit>=1.61",
    "pandas>=2.2",
    "plotly>=5.24",
    "reportlab>=4.2",
    "pillow>=10.4",
    "openpyxl>=3.1",
    "libsql-client>=0.3.1",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
