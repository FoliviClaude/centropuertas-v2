# Charte graphique Centropuertas : vert vif pour les éléments d'action,
# combiné avec du noir / gris anthracite / blanc. L'utilisateur peut
# toujours basculer clair/sombre depuis le menu natif de Streamlit
# (⋮ > Settings > Theme) ; ce fichier ne fixe que les couleurs de base.
[theme]
base = "light"
primaryColor = "#4CAF50"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F3F1"
textColor = "#212121"
font = "sans serif"

[browser]
gatherUsageStats = false

# "minimal" masque le menu ⋮ (rerun, clear cache, Deploy...) de façon
# robuste et officiellement supportée -- contrairement à une règle CSS
# ciblant #MainMenu/.stAppDeployButton, ce réglage ne dépend pas de la
# structure interne du DOM de Streamlit et ne casse pas d'une version à
# l'autre. Les options resteront masquées tant qu'aucune n'est ajoutée
# explicitement via st.set_page_config(menu_items=...) ou par Streamlit
# Community Cloud lui-même.
[client]
toolbarMode = "minimal"

# Sert les fichiers du dossier "static/" (manifest.json, icônes PWA)
# tels quels, à l'URL /app/static/<fichier>. Nécessaire pour que le
# navigateur mobile trouve le manifest.json référencé dans app.py.
[server]
enableStaticServing = true
